- author: "Lisa"
  date: "2016-02-15T13:04:37.524Z"
  content: "Nice initiative. Anytime anyone creates measures to make winter biking safer, it is a good development. I love winter biking by the way! I take extra precaution though because the last thing I want is to suffer an accident because of the conditions."
- author: "Anonymous"
  date: "2016-03-09T04:46:09.998Z"
  content: "I love that there is room to lock up outside WIMR in the winter. Now that the weather is getting nice, it&#39;s a bit harder to find a spot on those racks. I&#39;m glad they put in a bunch of new racks between towers 1 and 2. I just happened upon your blog after searching for bottom bracket info. Winter has taken its toll and my bad weather bike is starting to click down there, so I think I will also end up getting myself another Shimano BB UN-55. The last one was installed during July 2015. I&#39;m a little unimpressed that it has begun to fail after just half a year, but at least it&#39;s a fairly cheap part."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2016-03-09T12:53:25.948Z"
      content: "Regarding WIMR: Yeah, that&#39;s where I park too. I was a little annoyed that they didn&#39;t clear the snow around the racks, but apparently that was due to miscommunication between different parts of the university/hospital and will hopefully be fixed next winter. Half a year is really bad for a bottom bracket. There is a new option out there from IRD. Reasonably priced and with replaceable bearings: <a href=\"http://boulderbicycle.bike/Bottom-Brackets-and-Parts/Modern-Production/IRD-Bottom-Bracket-JIS-113mm-QP-95-exciting-bb-option.html\" rel=\"nofollow\">IRD QP-95</a>. I might give that one a try."
