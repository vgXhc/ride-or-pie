- author: "lostinacrowd"
  date: "2018-11-19T15:37:25.531Z"
  content: "How are they going so far?"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2018-11-19T15:55:45.912Z"
      content: "Good timing for your question. Just on Saturday I switched them out for my studded tires. I have ridden the Panaracers for pretty much exactly 3000 km/1900 mi, and they still look pretty good. I&#39;m very happy with the ride quality, the number of flats has been okay, and they have also grown a bit in width. I&#39;ll update this post or maybe write a follow up with some more information and pictures."
    - author: "Anonymous"
      date: "2019-02-28T20:43:03.781Z"
      content: "Thanks for this excellent review!  When you do an update, would you please share the final width the tires settled into?  Did you get to the 38mm?  Thanks!"
- author: "Anonymous"
  date: "2018-11-22T15:58:35.668Z"
  content: "I just bought a set of these Panaracer tires when I found your blog. Do you ride them tubeless of with a tube? (since you mentioning you had some flats).  How many flats did you have btw? I am a bit worried that they aren&#39;t much better puncture proof then my current Vittoria Corsa Control G+ but that could be compensated by going tubeless. Looking forward to your reply and updates. Greetings from The Netherlands!"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2018-11-22T16:24:37.881Z"
      content: "Sorry, I should have made that more clear. I&#39;m running them with tubes. The few flats that I did get were from sharp wires, which probably would have punctured other tires as well. They definitely seem more flat-proof than the Pacenti Pari-Motos I&#39;m running on a different bike, even though they look very similar."
