- author: "GeekGuyAndy"
  date: "2012-04-02T03:57:44.472Z"
  content: "I gave up on dry lube. That stuff is just too toxic for me, and doesn&#39;t last beyond one ride unless it&#39;s perfectly dry out and I stick to paved roads all day (both of which are unlikely scenarios). I think what I was using is FL in the green bottle for &quot;wet.&quot; The guys at the Bike Rack cringed when I tried to buy more in the summer, but I told them that my eyes burned last time I tried to apply dry lube, and I wasn&#39;t willing to do that again. I&#39;ve never seemed to notice any downsides to wet lube either, whether that was on the commuter in rain/snow, or on the race bike on a nice day. I just apply it once in a while, and wide off the excess every once in a while. It certainly lasts a while between applications, so long as excess is taken off since otherwise it&#39;s just attracting more dirt. I also stopped using degreaser and haven&#39;t noticed any issue there either. One less toxic chemical seems good to me. I saw Kent&#39;s review too and considered trying Chain-L, but I guess I&#39;ll wait on that idea."
- author: "Kent Peterson"
  date: "2012-06-14T13:46:22.815Z"
  content: "I&#39;m guessing it&#39;s the salt. We don&#39;t salt the roads here in the Pacific Northwest. I really go months in wet weather without having to reapply Chain-L. Also, apply it to a warm chain &amp; let it soak in. Use &quot;too much&quot;, wipe off the excess, ride around a bit, wipe off the &quot;new&quot; excess &amp; crud. BTW, no I get no kickback from Chain-L. We do sell it in the shop I work at, but we sell far more of other lubes that aren&#39;t as messy to apply."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-06-20T19:06:27.424Z"
      content: "Kent, I just noticed your comment now. Re-reading my post, it sounds overly harsh. It was not my intention to accuse you of anything. Despite our different experience with Chain-L what I&#39;ve said in the opening paragraphs still stands: I find your bike-related advice generally useful, trustworthy, and interesting.  Back on topic: The salt might have something to do with it, but after another couple of months of using it I can say for sure that that&#39;s not the only issue. In April, for example, I did a ride from Montreal to Toronto, about 650 km. I had lubed up the chain before I left and there was zero rain on the way. By day 4 or 5 I definitely started noticing that the chain was starting to run dry. And after riding through the rain I still pretty much have to relube immediately to avoid rust and squeakiness."
- author: "DeeTeaD"
  date: "2012-07-22T00:16:29.226Z"
  content: "I read an article in a motorcycle magazine back in the early nineties comparing many different chain lubricants, even plain motor oil. The chain lube that won that shootout by a good margin was PJ1 Black non o-ring lubricant. Like most other motorcycle chain lubes it comes in a spray can and is very tacky when it dries but what seems to set it apart is that it contains molybdenum sulfide, a very slippery powder. I sometimes use Rock n Roll Extreme or Finish Line dry for cleanliness but when I want a chain lubricant that lasts and withstands extreme conditions it&#39;s PJ1 Black."
