  content: "Save your money and use warmshowers.org and couchsurfing.org, and you&#39;ll get dinner, a bed to sleep in, and breakfast in the morning for $0. I&#39;ve toured and traveled using those resources, and have also hosted others, and it beats dishing out money for hotels and convenience store food any day. I&#39;ve met some really great people and reciprocated the favor when they needed a place to stay as well. Of the ~15 or so people I&#39;ve stayed with or hosted myself, I&#39;ve never had a negative experience."
