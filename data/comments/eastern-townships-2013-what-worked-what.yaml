- author: "Anonymous"
  date: "2014-04-05T23:33:28.117Z"
  content: "Finally reading some past blogs I saved for later... I love Warmshowers. I&#39;ve stayed with people 7 times now, and hosted one myself. At worst, it&#39;s a free sleeping spot indoors, and at best it&#39;s a night full of talking about cycling, cities, politics, etc. while eating a real dinner. Some have been just a couch, while others I had a private basement apartment. It may be unusual to stay in someone&#39;s house like this, but it&#39;s always worked out great for me. There are a few biker inns on Airbnb/Flipkey these days too. 900g for a summer sleeping bag sounds like a lot. I used this 830g one for everything other than camping in snow http://www.montbell.us/products/disp.php?cat_id=3213&amp;p_id=2321171. I since got a GoLite quilt, with the same temp rating but even lighter (specific model doesn&#39;t exist anymore unfortunately). Many down bags are overly expensive, but if you find one with few bells and whistles, that still uses 650/700 fill, it can be relatively cheap and very light. Unfortunately most brands now sell 800-900 fill which makes the bag cost almost twice as much. :( I&#39;ve been using the VO compact crankset (30/46t) with 11-28t in back and found that fits my full range including off-road adventures. Anything requiring a lower gear, I may as well just walk. 46x11 is still more than plenty unless I want to keep spinning &gt;35mph. More recently I&#39;ve found that I barely keep pedaling over 28mph, which has me almost considering a single crank, though I worry it may not be great in the mountains. I&#39;ve never used the fluffy pillows, but do carry a &quot;flocked&quot; inflatable pillow. Un-flocked is just an airbag and your head will roll off. I can pile some clothes on top if I need more height. I&#39;m still open to trying new things here though because it&#39;s not perfect yet.  Hope you have more tours coming up!"
