- author: "Brian W. Ogilvie"
  date: "2013-08-06T20:42:31.404Z"
  content: "Thanks for the post! Another limitation is that the heatmap doesn&#39;t show rides that don&#39;t contain a segment that has been raceshaped. I&#39;m not sure what that means in terms of how much of Strava&#39;s data is represented on it."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2013-08-07T00:53:47.578Z"
      content: "Hm, I must admit that I don&#39;t fully understand what &quot;raceshaped&quot; means, as I&#39;ve never used their other services. But when I look at roads I know and compare them with their popularity on the global heatmap, things seems to match up fairly well. Thanks for pointing out this potential limitation, though!"
- author: "GeekGuyAndy"
  date: "2013-08-16T13:18:19.165Z"
  content: "Being &quot;raceshaped&quot; means that a user allows the raceshape website to compile the data to add to their heatmap. Essentially that means that relatively few Strava users&#39; data will show unless many more people hear about it and have their data compiled in this way. It&#39;s been very apparent from Ithaca data (at least a few months back when I first heard of this). I have a lot of rides mapped, and some of random backroads that are unlikely to have the entire route randomly replicated by someone else - so I could easily see that my data (some 20,000 miles of it) was creating a very large portion of the 50-mile radius of Ithaca. A few more riders &quot;raceshaped&quot; their data, but there&#39;s still empty spots on the map where I know people are riding. But now Strava has their own route planning software. I upgraded to premium for the month to try it out. It works very well in some ways, and they seem to claim that it uses all riders data to help stick you to the popular routes. The main issue I have though, is that it still doesn&#39;t show you those routes. For an example, I knew I was headed to VT and decided to try to make a 20 mile route. I clicked around on the map, but in a 20 mile loop, without the site showing suggestions, I found that I&#39;d have to click a bunch of farther destinations to get an idea of what they were using others&#39; ride data for. But it&#39;s brand new, so maybe in a few months they will have a better system for showing these roads."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2013-08-16T13:29:11.089Z"
      content: "Ah, thanks. So where do you allow raceshape to use your data? I can&#39;t find an option anywhere on their website. Or is it only by using one of their tools for a specific ride individually? If it&#39;s the latter, I&#39;m somewhat surprised that the heatmap data is actually any good."
    - author: "GeekGuyAndy"
      date: "2013-08-16T14:13:54.069Z"
      content: "Their link went away - maybe too many people were overloading the system. Just go to http://x.raceshape.com/heatmap/ and you authorize the use of your Strava data and it will compile a personal heatmap."
    - author: "Hobbes vs Boyle"
      date: "2013-08-17T12:11:51.438Z"
      content: "Thanks again, Andy! This is a pretty big limitation for the route planning approach described in my post. I&#39;ll add a note to clarify."
