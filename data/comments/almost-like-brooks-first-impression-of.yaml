- author: "GeekGuyAndy"
  date: "2012-03-06T22:02:15.009Z"
  content: "I&#39;ll be interested to hear about the break in period on these. That&#39;s the main reason why I&#39;ve never tried a leather saddle - after hearing reports of people riding in discomfort for 500 miles hoping for change that had yet to come. After my last saddle troubles a few years ago, I bought a $20 one from the bin at the Bike Rack and put 5,000+ miles on it and have been very happy."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-03-08T14:00:00.867Z"
      content: "Well, leather is natural product, so the break-in period varies widely. My experience so far:  * Brooks B17 Imperial: Comfortable from the beginning. Breaking in (as in visible deformation) took definitely more than 500km but it didn&#39;t really matter as the improvement in comfort wasn&#39;t that noticeable. * Brooks B17: we gave this saddle to the accomplice&#39;s dad as a Christmas present. Even after riding it for over a year the saddle was still hard as a rock--and uncomfortable. I&#39;ve offered to take over the saddle and see if my 190lbs will make it break in.  * Brooks B17S (women&#39;s): this saddle, ridden by my accomplice, broke in very quickly, definitely less than 500km * Brooks Swallow: significant deformation visible right after the first 120km ride My general advice is: if you have a plastic saddle you&#39;re happy with there is no good reason to switch to a leather saddle. They&#39;re heavier, need to be covered in the rain, and if you have bad luck with the leather they&#39;ll either stretch out too quickly or not quickly enough."
- author: "Bob Torres"
  date: "2015-05-15T14:58:36.280Z"
  content: "Here&#39;s my 2 cents since I have both the Model 1 and 3 on two different bikes. My model 3 has the most mileage, about 6,000 miles while my Model 1 has around 3,000. Both saddles are broken in and feels pretty dam nice! I also own Brooks B-17, Swift, and Pro. They are all fine but the Swift is my least favorite of all of my leather saddles. I&#39;ve been riding leather seats since 1997. And yes I also ride a weight weenie road bike with a plastic light saddle and I enjoy this ride too but for me leather rules!   My model 1 is on a steal frame road bike and I ride it on 200k brevets and century rides. It gets more comfortable as it gets ridden more. My model 3 is on my commuter/touring/trail bike and this saddle is awesome! The leather has a nice rubbery feel that hold me nicely during the ride. Will it last compared to my B-17 which is on my VO Rando bike and the saddle has over 16,000 miles, who knows but my model 3 has ridden in plenty of lousy weather and is holding up pretty nicely.  I don&#39;t worry about the weight because the whole bike is no light weight to begin with. But I have ridden quite a few 200k brevets, most of my commutes and many multi-day rides on it and it has never bother me. The comfort rules and this matters most for me.    The Model 1 and especially the Model 3 are both well made and I would not hesitate to buy another, even to replace an old Brooks...........period!"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2015-05-15T17:05:29.005Z"
      content: "Bob, thanks for chiming in. I don&#39;t have anything new to report on my Model 1. It&#39;s been creaking a bit lately, but I attribute that to the additional stress from having my bike set up with a fixed-gear drivetrain."
