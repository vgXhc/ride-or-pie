- author: "adventure!"
  date: "2012-09-23T02:56:56.242Z"
  content: "Really enjoying these posts! Look forward to new ones. Regarding the Route Verte and all this &quot;Cyclist Approved Camping&quot;, do any of the campgrounds have policies where they don&#39;t turn away cyclists? Or is it if they&#39;re full, they&#39;re full?"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-09-23T12:14:50.720Z"
      content: "I&#39;m glad you&#39;re enjoying the report! We did have the official Route Verte guide with us. The problem is that is has practically no campgrounds listed -- all the accommodations are hotels and B&amp;Bs, often pretty expensive ones at that. The only time we stayed in a &quot;Bienvenue cyclistes&quot; place was the Super-8 in Trois-Riviéres. We did get the impression that the person at the front desk was especially nice to us and gave us quite a bit of discount on the still expensive last remaining room.  I&#39;m not sure how regular campgrounds handle the issue. The campground on day 1 was practically empty; and on day 3 we had booked in advance. I could imagine that in many cases they&#39;ll find a little corner for you and your tent."
    - author: "adventure!"
      date: "2012-09-23T19:10:30.719Z"
      content: "It&#39;s interesting that they would &quot;forget&quot; about camping, as I feel that a majority of folks who bike tour camp. Are they going by the outmoded definition of &quot;bike touring&quot;, where camping was eschewed? Or, are they trying to aim for a more monied demographic?"
    - author: "adventure!"
      date: "2012-09-23T19:15:18.537Z"
      content: "Also, while the idea/execution of the Route Verte was mostly good in my experience, the info/literature/web stuff (and their customer service) left something to be desired. When I planned my trip to Montreal in 2007, the routing on the website was pretty vague so I emailed the organization. They told me the only thing they could send me was a guidebook in French for $20. I asked if they had smaller maps for different regions, and they said &quot;no&quot;. And when I finally got into Quebec and visited info centres, whaddya know? Plenty of <b>free</b> Route Verte maps for <i>different regions of Quebec!</i>"
    - author: "Hobbes vs Boyle"
      date: "2012-09-24T01:14:41.434Z"
      content: "Yeah, I&#39;m not a fan of Velo Quebec either. We&#39;re currently members (mostly because of the discount for signing up for the Tour de l&quot;Ile) but won&#39;t renew next year. In preparation for this tour we went to the Maison Cycliste, which is like their HQ in Montreal and asked if they had a campground guide. The dude working at the counter looked at us as if we had insulted him just replied with &quot;No, we don&#39;t.&quot; And that was that. Their guidebook is nonetheless useful for planning. They list the available services along the way and provide distances from one town to the next. I think that&#39;s worth the 20 bucks or however much it costs."
    - author: "Hobbes vs Boyle"
      date: "2012-09-24T01:21:10.531Z"
      content: "Oh, and about the camping: I&#39;m not sure what&#39;s going on there. We very rarely encountered fully loaded cyclists on the whole trip. It almost all day riders or credit card tourers (the two groups being hard to distinguish from each other). So maybe there&#39;s not much demand. I can also imagine that the campgrounds don&#39;t see cyclists as a huge market, and since I suspect that hotel and campground owners have to be in order to be included in the guide (I could be wrong about this) they maybe don&#39;t consider it to be worth it.  The freely available Quebec campground guide did the job for us."
    - author: "adventure!"
      date: "2012-09-24T05:22:24.451Z"
      content: "Oh, I don&#39;t doubt that the guidebook would be useful. I just felt it would be overkill for what I wanted to do: US border to Montreal, not much over 100km, then the Montreal-Quebec City connection. (Turned out I didn&#39;t do it.) If I was doing more of a province spanning ride, or planned on coming back soon to do more stuff, then the guide would be useful. It would also be much more useful if it was in English!"
