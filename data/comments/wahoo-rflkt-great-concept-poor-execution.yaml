- author: "Anonymous"
  date: "2016-04-10T19:50:39.724Z"
  content: "Have you found using Strava on a phone reliable? I use the app for runs/walks, but that&#39;s &lt;1hr so I&#39;m not worried about battery life for that. I&#39;m still using my good old Garmin eTrex (had a Legend C, now using a 20) for rides of any length. It would be nice to have a smaller unit, but I love having the maps and data in front of me, which is something my phone wouldn&#39;t work well for unless I brought a huge battery pack."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2016-04-10T20:05:34.694Z"
      content: "Strava on the phone is reliable enough for me, i.e. it records distance and speed with acceptable accuracy. The elevation data is basically worthless, but I don&#39;t care too much about that. Battery life is also surprisingly good when you don&#39;t turn on the screen. These days I usually ride by cue sheet, but if I do want maps, I bring the old Garmin (and also carry a paper map in my handlebar bag)."
