- author: "Surlyrider"
  date: "2012-05-11T14:37:58.380Z"
  content: "I have the same tires, with about 2,000 miles on them.  They are the only tires I&#39;ve had on my ride, and the mileage took about 14 months.  So far, no flats at all, and I ride in a new area under constant construction, so debris is a daily occurance.  I am always riding over small rocks or other material.  I can&#39;t speak for the speed, I average 17 mph or so over 12 mile rides on my Surly Crosscheck.  For me, over 50, that seems fast.  I&#39;m very pleased with the tires and see essentially NO wear on them to date.  Knock on wood."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-05-14T11:04:17.941Z"
      content: "Thanks for the feedback. I&#39;m still running the same tires at the moment and I should do a full review soon. Short version: After more than 7000km I&#39;m still very happy with them -- no flats and a great ride."
- author: "Anonymous"
  date: "2013-06-28T03:40:26.670Z"
  content: "How about the rolling resistance of the tires on asphalt roads in summer conditions??"
- author: "Steve.O"
  date: "2019-07-10T20:23:11.287Z"
  content: "I have a bit of a contradictory story, I have about 300-400 miles of city riding (lots of debris/glass/etc) and have already found 3 small (~1/2&quot; - 2cm) tears, one of which picked up some glass and lead to a flat. I find that in order to get similar rolling resistance to my 28c gatorskins - not an entirely apples to apples compare - I need to run about 90psi, which feels a bit too high. That said they are moderately more comfortable and grippy than the gatorskins. If it werent for the small rips developing, I&#39;d keep riding them, but the rate at which they fell apart was pretty staggering. Note, I am 230+lbs and ride with another 20lbs of gear constantly, so this may play into it. Its also possible that the build quality has changed since these comments were posted 7 years ago"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2019-07-10T20:28:18.596Z"
      content: "Thanks for sharing your experiences. Bummer about the tears. And yeah, I would imagine that the tires have changed -- for a while it seemed like Vittoria had rebranded the whole Randonneur line under the &quot;Voyager&quot; label, but looking at their website, it looks like they&#39;re back to Randonneur. The only Randonneur I&#39;m still running at the moment is a Randonneur Hyper. I used it on the rear of our tandem, and I&#39;m curious to see how it&#39;s going to hold up."
- author: "Mike"
  date: "2020-11-26T18:37:01.391Z"
  content: "I have these same tyres in 35c size also. Shortly after i fitted the tyre the tyre width was, as you say, 32mm. After a few hundred miles i decided to get the measuring calipers out and measure the tyre again...this time the measurement was 35mm. Looks like the tyre becomes wider after bedding in."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2020-11-26T18:53:38.756Z"
      content: "Yes, tires stretching after the initial mounting is definitely a thing. In my experience, it&#39;s often only 1 or 2mm, but I think with some nice tires you can get even more stretch."
