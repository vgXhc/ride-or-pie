- author: "Anonymous"
  date: "2012-12-27T10:49:26.190Z"
  content: "Hello! I am Arsenio from the Philippines.I weld for a hobby and from what I have researched welded joints are stronger than the actual metal itself, along with brazed joints. I am no expert, but I do suggest taking it to a local welder or &quot;machine shop&quot; [as we call it here in the Philippines]. Ask for their opinion and assessment(whether the weld is really strong enough to be ridden on).  I hope this helps!!! And please do update of you do get it repaired :) PS. thank you for keeping a cycling blog! :)"
