- author: "John Speare"
  date: "2015-03-14T13:43:23.401Z"
  content: "Fun project -- I like the paint scheme. Can you fit Hetres on there? If not, you might consider the Pari-motos, which will give you that &quot;magic carpet ride&quot; (on a cloud) that you&#39;re after. For a while the CdV was the only option -- unless you could get your mitts on a Michelin -- but with the work you&#39;ve put into this project, you gotta finish it with some excellent tires. They make all the difference in the world.  With that combo of frame, fork, tire -- you&#39;ve got a really low trail bike: 33 if the numbers are all correct. That&#39;s good stuff there. Probably best with a light load over the front wheel."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2015-03-14T14:03:06.283Z"
      content: "John, definitely no Hetres. 38mm effective width might just work without fenders, but I think I&#39;d rather stick with 35mm. I had bought the CdlV&#39;s (used) primarily to figure out how wide a tire I could fit without spending too much money. According to Mike Kone, the Pari-Moto runs a bit wider than 38mm, and IIRC the Compass tires are also said to gain width over time. So my only option for a nice tire seems to be the GB Cyprés in 32mm—which would further lower the BB and be less than ideal."
