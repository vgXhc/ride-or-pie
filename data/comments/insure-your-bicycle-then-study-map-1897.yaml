- author: "Anonymous"
  date: "2014-03-30T17:39:02.211Z"
  content: "That is basically how I routed my 100 mile 2-day tour in New Hampshire. I found a historical book (on Google Books) describing the first turnpike roads built in the 1790s and tried to find which roads those were now. Roads mostly went between towns, and for the towns that did well, those roads turned into state routes or highways eventually. But there are many towns based around lumber or farming that didn&#39;t have a reason to be upgraded for higher traffic, and they made for perfect touring routes. They generally stayed in forest areas, had very little traffic, and had gentle bends and rolling terrain that kept it more interesting than a straight and flat road. Here&#39;s one of the days: http://www.strava.com/activities/19180404"
  replies:
