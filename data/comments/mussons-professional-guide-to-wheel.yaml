- author: "Anonymous"
  date: "2015-02-27T17:38:04.820Z"
  content: "This was interesting to read. I&#39;ve built wheels a few times now, and used only a spoke tool. Truing (in all directions) was checked in my upside-down bike, spinning the wheel and checking the clearance to the brake. I wasn&#39;t concerned with dish in the front, as equal tensioning should result in a good wheel, and on the rear I just tightened the drive side more in the beginning, and it came out well each time. I guess tools could help ensure more perfectness, but I didn&#39;t find it necessary."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2015-02-27T18:03:11.152Z"
      content: "Yeah, my first one or two wheels were built in a similar way, and they also held up just fine. I used zip ties attached to fork/seat stays to check the truing. If I had to pick just one wheelbuilding tool in addition to the spoke wrench, it&#39;d probably be the truing stand. It&#39;s just much more comfortable and precise than the in-bike method."
    - author: "happyriding"
      date: "2026-08-12T05:55:18.996Z"
      content: "I&#39;ve had two hubs fail while on mountain bike trips (Hadley and I9), and after ordering a new hub I built the rear wheel using my mtb as a truing stand.  I have searched far and wide for a portable truing stand that I could take with me on trips, but nobody makes a quality one.  I have one of those Park Pro Truing Stands at home.  Now, I always travel with a spare hub, spokes, a Park Wag-4 dish stick, and my wheel building tools--that way I will only have one day of down time while I build a new wheel--rather than having to wait several days for parts to arrive.  I&#39;m currently running an Onyx rear hub, and it has been completely reliable."
