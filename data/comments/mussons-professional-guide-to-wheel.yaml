  content: "This is a great review and I love knowing that I can build some inexpensive tools to help with the build. Thanks so much for the thoughtful details. I haven&#39;t built a wheel yet, though I have repaired a badly damage wheel by transferring the spokes to a new rim. would love to hear from you, if you have any idea where I can get a copy of the book?  All I can find is a PDF online, no hard copies, and I do so much better with pages in hand. Cheers!"
