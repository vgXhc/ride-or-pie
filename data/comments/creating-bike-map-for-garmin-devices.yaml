  content: "Did you try using a TYP file too? I have no idea what exactly that does, but it says &quot;Maps can be rendered more appealing when a TYP file is used.&quot; There&#39;s also the OpenFietsMap, which I have no tried. They looked fine to me (a huge improvement over the 1999 Metroguide maps I had), though one oddity was that the background on filled in areas like swaps wanted to refresh often. I&#39;ve only tried it on the etrex 20 and not the Legend C though."
