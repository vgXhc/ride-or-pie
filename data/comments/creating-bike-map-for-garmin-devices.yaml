- author: "GeekGuyAndy"
  date: "2012-11-28T04:03:54.066Z"
  content: "I didn&#39;t get a chance to try your version yet, but when I recently got a new GPS I was searching around and found what looks like all those steps already done automatically and online. I was able to just select the tiles I want, download it as one file, and load it onto my new etrex 20. The OSM data even included my driveway (cause I added it!) and other trails that I&#39;ve been working on adding. I also played around with the new garmin custom maps and was able to load satellite imagery on it. Check it out: http://garmin.openstreetmap.nl/"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-12-13T17:48:34.254Z"
      content: "This looks very nice. The main reason for compiling my own map was that in Montreal you need a map not neatly confined by administrative boundaries. So you need a little bit of QC, ON, NY, VT each and no pre-made map offered that. Well, I guess there now is an easy fix to this. Thanks a lot for the link!"
    - author: "Hobbes vs Boyle"
      date: "2012-12-13T17:49:55.629Z"
      content: "Quick question: is the map searchable? &quot;Mine&quot; is."
    - author: "GeekGuyAndy"
      date: "2012-12-13T17:52:33.169Z"
      content: "It&#39;s still not perfect in that you have to select tiles of various sizes instead of just selecting where you need. Fortunately that need basically disappeared with the etrex 20 which has 2gb internal memory and I added a 4gb card to it - a HUGE upgrade from my Legend with only 24mb of storage!"
    - author: "GeekGuyAndy"
      date: "2012-12-13T17:54:10.002Z"
      content: "I tried to search by address with no luck. I read some workaround to that but haven&#39;t tried it yet. I could search by towns without issue though. The important detail was that it is routable."
    - author: "Hobbes vs Boyle"
      date: "2012-12-13T18:57:35.888Z"
      content: "Okay, that seems to indicate that searching does work, but the data in the region you tested does not include proper address data. This is an issue when proper administrative boundaries haven&#39;t been added to the map (they can be difficult to obtain). I&#39;m downloading a map right now and will see how it goes."
    - author: "Hobbes vs Boyle"
      date: "2012-12-14T14:34:21.485Z"
      content: "So I&#39;ve downloaded a map and played around with a bit (only in Basecamp, not on the Garmin). I couldn&#39;t get the address search to work either. The map also has a couple of problems, like &quot;flooding&quot; near large bodies of water that haven&#39;t been downloaded completely. In Basecamp I also don&#39;t like the visual style that much: fonts are too small and labels sometimes placed badly.  I think I&#39;ll stick with my custom generated map for now but it&#39;s great to see that an easy alternative exists."
