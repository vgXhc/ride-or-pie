      date: "2021-06-24T23:09:25.814Z"
      content: "I have had some issue with my record-keeping, but I got at least 6000 km out of one of the tires. The one that was on the front of my tandem is nearing the end of its life at about 3000 km. I&#39;m very satisfied with that, and given that some UV deterioration has become visible (the bike gets parked outside somewhat regularly), I think the tread thickness seems to be just right."
