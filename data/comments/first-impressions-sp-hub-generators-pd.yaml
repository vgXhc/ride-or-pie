- author: "Anonymous"
  date: "2013-09-13T09:43:53.103Z"
  content: "Hi I used a SP PD-8 dynamo hub on a recent solo cycling trip across Europe.  I cycled about 9000kms in total in -15 to +52 degree heat.  I cycled in pouring rain and 100s kms in dirty and dusty tracks. I cycled in 13 countries in total over three months.  My chain broke, my cassette broke and I had serious issues with my gears, but not one single issue with the dynamo hub. The SP PD-8 is a sealed unit and as such isn&#39;t really serviceable by the user, like most dynamos. I am no mechanic, so I wouldn&#39;t attemp to repair it if it broke, but maybe someone with better skills may find it easier. All I know for sure is that it has done about 9000kms of trouble free cycling and gets my vote for durability."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2013-09-13T12:26:35.551Z"
      content: "Darron, that&#39;s great to hear! I don&#39;t have quite as many kilometers on my units as you do, but I also haven&#39;t encountered any issues so far. Thanks for providing feedback."
