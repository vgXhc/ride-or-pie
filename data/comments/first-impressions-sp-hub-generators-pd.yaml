- author: "GeekGuyAndy"
  date: "2011-12-15T15:38:10.083Z"
  content: "I&#39;ll be interested to hear how these do. I was very skeptical about the VO hubs, and I believe their weight was much higher too (there was a very large metal disc as the switch). My Shimano DH-3n80 is still going strong even after a shop mechanic yanked the wire out about a year ago when I asked for new bearings. The Cyo has taken a good beating too - scratches on the lens, and water spots from a cleaning mistake with the bike upside down. I think Santa is getting me a taillight for the system this year too. I saw a good comment about the power output of dynamo hubs that I agreed with: It would be ideal for us to have lights that reach full power closer to 12-15mph instead of 3mph, since that could reduce the drag even further. Or keep a similar amount of drag, but have a light with more output at the typical cruising speeds."
- author: "Hobbes vs Boyle"
  date: "2011-12-15T19:03:52.388Z"
  content: "Yeah, the broken cable is what happened to my Shimano, too. Unfortunately my soldering skills were not good enough to fix the issue.Soldering aluminum wire in a tight spot is hard. About power output: I honestly don&#39;t care about the little drag that modern generators create. If you do care, however, you should get one of the generators made for 20&quot; wheels. They do exactly what you want: create full power only at higher speeds. The only problem is that with LED lights you will have to day with flickering lights at lower speeds. Not worth the saved 20g and 0.x W, IMO."
- author: "Rob"
  date: "2012-02-10T22:08:43.982Z"
  content: "I love my SP dynamos. I also have the PV-8 for the road and a PD-8 for my mountain bike, and my own home made light! There&#39;s a bit more on my MTB setup here: http://bit.ly/AlkU7Y I got my SP hubs from IDC, who did a great service and speedy delivery: http://bit.ly/wsBkEK  I&#39;m getting a switchable one next for minimum rolling resistance in daylight"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-02-13T17:19:52.832Z"
      content: "Hi Rob, good to hear that other people have the SP dynamos too and are happy with them. I&#39;m very curious to see how the hubs will hold up in the long run. I still have to wait for spring to actually test the one on my road bike."
- author: "Andrew Priest"
  date: "2012-07-27T02:03:19.102Z"
  content: "Thanks for the posting on the Shutter Precision PV-8. Had you had a chance to use the dynamo and do you have any updated thoughts worth sharing on it?   Also I am curious as to whether you have any idea if the Supernova dynamos are in fact SP ones. Thanks Andrew"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-07-27T13:24:44.059Z"
      content: "Hi Andrew: I&#39;ve had the PV-8 on my road bike for two months now. I&#39;ve done probably 1000 km on it, including two 300 km brevets. So far I have zero complaints. The vibrations are less noticeable than on my Shimano DH3N80/72, they output enough power, the wheel holds up well. At this point the only question is how long they will last and how the bearings can be serviced. The disc hub which will go on my everyday bike I still haven&#39;t built up but I plan on doing it before winter arrives.  Re Supernova: I&#39;m 95% sure that the Supernovas are made by SP. If there are any differences in quality control or other aspects I don&#39;t know. HTH,  Harald."
