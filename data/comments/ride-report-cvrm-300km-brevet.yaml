- author: "GeekGuyAndy"
  date: "2012-06-27T15:14:40.292Z"
  content: "Are you allowed to take a detour? I thought brevets had to be ridden on the given route unless there was something making that impossible. Though controls are also supposed to be placed so that no detour would provide a shortcut. While extending the distance to 400k shouldn&#39;t be too hard, I&#39;ve consistently heard that the difficulty comes in managing time. It&#39;s likely too short to make a long sleep break worth it, and possibly too long to ride continuously. Though when I did the 24hr fleche ride, the time wasn&#39;t much of a problem for me, so who knows. Also, since I was reminded by the pic with the Garmin, if you haven&#39;t tried out the newer 8x lithium AA batteries yet, they are amazing. I got 37 hours of use on a set on my Garmin, including about 10 hours with the backlight on."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-06-27T17:33:06.172Z"
      content: "Re detours: The CVRM seems to have a fairly relaxed attitude about this. Even on the first ride I did with them we took a wrong turn about 1 minute after the start and nobody cared. I did not expect that but have come to appreciate it. No point in slavishly following the cue sheet if a fellow rider knows a better alternative (which, of course, shouldn&#39;t be shorter or avoiding hills). Batteries: do you have a link? I&#39;m running Eneloops which probably give me around 20 to 25 hours without backlight. 400: Yeah, sounds plausible, especially if you have a more challenging course and therefore will take longer. Well, I&#39;ll probably find out next year."
