- author: "Anonymous"
  date: "2015-02-26T11:58:03.056Z"
  content: "Nice review, thanks for sharing.  I&#39;ve built up three sets so far myself but could use some more background.  What is his opinion on tensionometers?"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2015-02-26T14:29:22.691Z"
      content: "In his words: &quot;If you build a wheel and they are working ... then you don&#39;t need a tensiometer. If your wheels are <em>not working</em> as intended, then a tensiometer is not a magic cure for obtaining good wheels.&quot; He suggest that plucking the spokes and tensioning by tone is faster and works well enough. I&#39;ll address this in part II of the review."
    - author: "Hobbes vs Boyle"
      date: "2015-02-26T14:30:49.480Z"
      content: "Sorry, the quote should be &quot;If you build your wheels without a tensiometer and they are working...&quot;"
- author: "Chuck Davis"
  date: "2015-02-28T15:10:06.217Z"
  content: "I rather doubt that any wheel builder who comes to build wheels using a tension gage will say that his/her wheels are not &#39;better wheels&#39; for use of a tension gage Most wheels that have a reasonable quantum of tension and are true will do o.k. generally It is the use of the tension gage the achieve adequate tension and balance it our around the wheel that will yield a &quot;better wheel&quot; &quot;I worked for years without a tensiometer being under the false impression that instinct and experience were enough. Then I bought one of the first HOZAN tensiometers on the market and started making comparisons. Shamefacedly I had to admit that my super instinct was not so super after all. Even my mood on any particular day gave different results. Since then I work with a tensiometers and it is always at hand next to the truing equipment.&quot; (Schraner PP.47-46) People seem to miss the real gem in building a wheel the (&quot;Schraner way&quot; - as to the truing protocol) (Munson p.55) &quot;A special tool does exist for measuring the tension in a wire spoke. Since I have not used one of these tools I cannot comment on its usefulness. If you do obtain one then make sure it is calibrated for your specific spokes by checking with the tool manufacture who will also advise on numeric tensions to use.&quot;"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2015-03-01T18:26:54.431Z"
      content: "Yeah, it all boils down to what we consider a &quot;better wheel.&quot; Were the wheels that Schraner built before his HOZAN revelation bad wheels? Probably not. Were the tensiometer-checked wheels &quot;better wheels&quot;? Maybe, maybe not."
    - author: "Anonymous"
      date: "2015-03-02T11:36:28.331Z"
      content: "Hi Chuck, Which edition of the book are you quoting from? I could only find the paragraph you quoted in the 1997 Edition 2 (and it appeared on page 40). From then on I discuss tensiometers in detail. Here&#39;s an online article I wrote... http://www.wheelpro.co.uk/support/tensiometers/ Cheers, Roger"
    - author: "Chuck Davis"
      date: "2015-03-05T20:39:16.169Z"
      content: "I have the 3rd Ed of Roger&#39;s book that my referenced quote is from at the indicated page; I really don&#39;t know where the book originally came from, I&#39;ve had it a while I have been building wheels for over 20 years at my shoppe; I have been using a DT tension gage for nearly 15 years and prior to that used a Hozan gage I got started building wheels using Robert Wright&#39;s book probably in the early 80&#39;s and from my perspective it was more than adequate to get me started I have reservations that any of the books on the market do much more than expose a reader to some basic theory and general instructions re how to proceed I have and have perused Brandt&#39;s, Schraner, and Munson&#39;s &quot;mini tomes&quot; and by far Wright&#39;s portrayal re lacing common spoke patterns is ten fold easier to get a handle on than any I have been exposed to I had a couple of wheel building classes a few ago at the shoppe that were seemingly well received and I have taught and facilitated some bicycle mechanic/maintenance classes in the area It is my observation that as to wheel building some folks just flat should stay away from the activity and reading all the books out there ain&#39;t gonna help, and as to doing your own work on your bicycle (which I encourage) there are a few that really should be kept a min a 100 yds or so from a bicycle anytime they may have something as simple as a 5mm allen in their hand! Schraner titled his book &quot;The ***Art*** of Wheelbuilding&quot; and in my view it is not a book about &quot;how to build a wheel&quot; By and large how one feels about &quot;building wheels&quot; is tempered to a large degree on the attitude that is brought to the activity after an initial effort suggests that it might be &quot;rather fun and rewarding&quot; in some sense I fancy myself as &quot;somewhat competent&quot; and with enough confidence in my wheel building competency to stand 100% behind my wheels when they leave the shoppe I was initially made aware of Schraner method of finishing (truing) a wheel by a industry representative and friend who was visiting the shoppe who had been to one of Schraner&#39;s clinics I have yet to hear of a wheel builder who has tried or started building the &quot;Schraner Way&quot; who has not found it to yield a better wheel in all regards and quicker to finish the wheel I had the opportunity to meet Gerd Schraner at InterBike some years ago and found him to be a very quiet unassuming and unpretentious gentleman"
