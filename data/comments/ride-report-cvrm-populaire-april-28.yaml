- author: "GeekGuyAndy"
  date: "2012-05-01T02:06:50.566Z"
  content: "Great ride report. While Jan&#39;s advice to keep the stops short is probably good advice, keep in mind that also finished 90 hour rides in 45 - not something done by just keeping the breaks short! I find 30 minutes to be about the maximum time necessary; anything longer and I&#39;m just being lazy with no additional benefits. Quick 5 minute stops occasionally are nice, but I find if all my stops are brief ones, I feel rushed all day. I like the randonesia term. I certainly had some emotional ups and downs on my 300k this weekend, but after the fact I feel mostly great about the ride having forgotten the bad parts."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-05-01T15:55:24.449Z"
      content: "Oh yeah, I certainly have no illusions about the benefits of short breaks for someone riding at my lowly speeds. Part of the reason why I didn&#39;t stop much on the ride also had to do with the weather: with a high of 6 and 30+km/h wind stopping outside didn&#39;t seem particularly attractive. And gas stations and depanneurs in the middle of nowhere are also not amongst the nicest places to hang out at.  Sounds like on your riding the controles were at decidedly nicer places. About randonesia: it&#39;s quite amazing. At the moment I&#39;m feeling tempted to edit my original post and take out the part about it being one of the hardest rides I&#39;ve ever done. On Sunday I went on a leisurely 45k ride with a bunch of bike coop friends and my legs weren&#39;t nearly as bad as I had expected them to be..."
