- author: "GeekGuyAndy"
  date: "2012-03-10T23:20:37.775Z"
  content: "I went through the same debate last year and stuck to a $30 bb. Shoes and cranks also have the same mental debate for me as well. I&#39;ve never paid more than $100 for a pair of cycling shoes, but also don&#39;t expect more than 2 years out of them - while I hear others buy $300 Sidis and claim they will last many years. I went with a ~$125 Sugino crankset too, but I know that Compass sell theirs for $525. Would theirs really be 5x as good? I doubt it, plus I don&#39;t care to spend $5-10k on a bike and parts in hopes of every piece lasting for my lifetime either."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-03-12T20:18:08.764Z"
      content: "Yeah, price can be an indicator of quality but it&#39;s not necessarily a good one, especially in the upper range. I&#39;ve ridden cheap and shitty bike parts myself (and I get to see way too many at the bike collective I&#39;m volunteering at) and I&#39;m happy to have moved beyond them. But at a certain point you get diminishing returns and it&#39;s also a gamble: will that expensive hub/jacket/saddle really last that much longer? So in most cases it seems like a reasonable strategy to pick components and accessories in the middle."
- author: "Neil E. Hodges"
  date: "2016-11-12T12:49:16.510Z"
  content: "The only problem with going the &quot;cheap and replace often&quot; route is that you end up generating a lot more waste, which either goes to the landfill or takes more energy to recycle.  When the masses go this route—which they will—it generates tones of waste, after all. I wish more folks would consider this point."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2016-11-12T13:42:48.860Z"
      content: "I totally agree. It&#39;s been a couple years now, and I&#39;m still not happy with the mileage I get out of the cheap Shimano BBs on my year-round bike. So for the next replacement I might try the new IRD bottom brackets that have replaceable bearings: http://boulderbicycle.bike/Bottom-Brackets-and-Parts/Modern-Production-BB/ird-bottom-bracket-jis-107mm-qp-95-exciting-bb-option.html Or maybe go SKF after all."
- author: "Anonymous"
  date: "2016-11-12T15:35:09.469Z"
  content: "I&#39;ve had one SKF that was ridden through a few Ithaca winters and many summers and has definitely lasted better than anything else. Having the 10 year warranty seals the deal for me. I figured that this is one BB for 10 years, at around $10/yr, which is much cheaper than when I was buying a new $25-40 BB after each winter."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2016-11-12T15:41:34.351Z"
      content: "Good to hear that! I get about two years out of the Shimanos these days, which is not great. The current one is creaking already, but I&#39;ll wait until spring to replace it, probably with an SKF."
