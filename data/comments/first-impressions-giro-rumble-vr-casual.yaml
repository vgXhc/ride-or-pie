- author: "taz"
  date: "2016-06-21T14:06:54.593Z"
  content: "hi i see that you install shimano spd cleats. i was wondering does the cleats contact the ground when you walk on the pavement?  i have a pair of dzr mechanic and the cleats do make noises when walking on pavement, i hated that!"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2016-06-21T14:37:40.899Z"
      content: "It depends. On level ground, the cleats don&#39;t touch and the shoes don&#39;t make noises. But as soon as the pavement is rougher or there are pieces of gravel etc., they do start making crunchy noises. And as I said above, the cleats are not recessed very far, so that when the sole starts to wear, the crunching is probably going to get worse."
    - author: "Patrick Moore"
      date: "2017-07-26T15:38:55.848Z"
      content: "For decades I&#39;ve applied Shoe Goo or equivalents to the wear areas around the cleat which keeps the cleat off walking surfaces and extends the life of the shoe. My shoes tend to disintegrate at seams before the sole wears out. Note that a layer of Shoe Goo will, or might, require adjusting the pedal retention spring."
    - author: "Hobbes vs Boyle"
      date: "2017-07-26T17:39:22.441Z"
      content: "Patrick, your comment is timely: Just yesterday I applied Sugru to the sole of one my other bike shoes. Looks good so far, but we&#39;ll see how durable it is."
