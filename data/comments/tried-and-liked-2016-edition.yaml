- author: "Mitch H."
  date: "2017-01-02T23:32:51.971Z"
  content: "Harald, Thanks for the reports. You write that you haven&#39;t found a sleeping pad that is comfortable. Have you tried a Exped Syn Mat 7?  I have the 7 in long-wide, and its fantastic, much better than my older thick-wide Thermarest.  You blow it up hard, and don&#39;t bottom out even sleeping on your side.  Using included pump takes about 3 minutes to fully inflate.  The side chambers are little bigger than the middle, so you don&#39;t roll off so easily.  Weighs 2 lbs, a little hard to deflate it enough to get back into the included stuff sack. Thanks and keep up the good work! Mitch Hull in Michigan"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2017-01-03T00:01:40.931Z"
      content: "Thanks, Mitch! The Expeds are high on my list of mats that I will try next if the hammock thing doesn&#39;t work out for me. I&#39;ve read many good things about them."
