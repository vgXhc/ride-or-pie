- author: "GeekGuyAndy"
  date: "2012-09-21T16:47:46.525Z"
  content: "It&#39;s pretty amazing how few people understand that putting their seat to the right height would make riding much easier. At least you didn&#39;t seem to find too many knees-in-chest riders. I also noticed the two pannier users had it on the drive side. I&#39;m not really sure why this matters to me, but it always seemed wrong to put a lone pannier on the drive side."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-09-21T18:06:10.471Z"
      content: "Pannier on non-drive side is a thing? Fascinating. Never occurred to me. Personally, I&#39;m randomly switching sides every once in a while in order to achieve even wear on panniers and rack."
    - author: "GeekGuyAndy"
      date: "2012-09-21T18:09:38.238Z"
      content: "Not a big thing for sure, but it always seemed to me that with the moving parts on the right side, I&#39;d put the pannier on the left in case something fell out. Maybe it&#39;s because I had a cord get wrapped about a cassette once."
    - author: "Hobbes vs Boyle"
      date: "2012-09-21T22:21:48.418Z"
      content: "Well, FWIW, two months ago I got one my pannier&#39;s straps tangled up around the hub -- on the non-drive side. Quite possible that it would have had more catastrophic consequences on the drive side."
    - author: "adventure!"
      date: "2012-09-23T02:46:02.437Z"
      content: "When I use a lone pannier I always put it on non-drive. That&#39;s mostly because I want to keep any extra/weight stress off the drive side of the wheel. (Yes, I have broken numerous spokes in the past.)"
