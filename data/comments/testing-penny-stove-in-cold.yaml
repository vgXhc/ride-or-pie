- author: "Anonymous"
  date: "2012-02-17T08:55:55.446Z"
  content: "I use a penny stove -- and a pressurized stove similar to the penny -- at 2200m above sea level (right off my back porch), and I don&#39;t have too many problems. I just tested a design tonight, which the temperature was -12c. I had to heat it with about 5ml of additional fuel, but everything went pretty well. I also use these stoves at 3000m above sea level, too. This is in the late summer, however, the temps can still dip down below 0c, and, again, I don&#39;t have any troubles. For people to claim that the alcohol stoves do not work at high elevation, is both false and erroneous! I use them for a week or more, at 3km above sea level! If anybody has any questions you can contact me: NV6R_JWG (at) yahoo (dot) com"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-02-20T16:37:51.423Z"
      content: "Thanks a lot for your report! I never really questioned the performance of pressurized alcohol stoves in the cold or at elevation, especially most of the skeptics had never used a penny stove before. It was nice to see it for myself, though. This Montreal winter is exceptionally mild, so I probably won&#39;t be able to do another test at, say, -20°C, but I don&#39;t think that would drastically change anything anyway."
