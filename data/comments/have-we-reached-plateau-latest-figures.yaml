- author: "Anonymous"
  date: "2014-12-29T19:13:13.073Z"
  content: "A further complication of this data is adjusting for seasonality. I suspect that I&#39;m not alone in looking at my bike as a primary mode of commuting during late spring, summer and fall; but mostly use my car in the winter. A lot would depend on when the survey was taken.  Thoughts?"
  replies:
    - author: "Hobbes vs Boyle"
      date: "2014-12-29T21:09:58.540Z"
      content: "The ACS states that the data is taken &quot;monthly,&quot; which I assume means that the surveys are sent out at random over the course of the year and therefore seasonality should be averaged out. It could be, however, that this source of error is not factored into the larger margin of error that I have used in the charts."
- author: "Anonymous"
  date: "2014-12-29T19:22:27.884Z"
  content: "Reasons for the plateau?  The first thing that comes to mind is that we may have reached the point where the easy and most productive changes have been made - striping lanes and designating streets as bicycle boulevards that were already de facto bicycle facilities, where a little official recognition helps new riders feel comfortable. I have observed that most new riders are people who happen to have moved somewhere where they can bicycle more, and one day realize that fact.  That suggests that one way to break through the current plateau is to make sure the city/county/state are building more places where people can make the connection to bicycling.  Unfortunately, the Bike Fed backed out of supporting smart growth back in 2008, and that may have reduced the growth potential in future years."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2014-12-29T21:17:45.865Z"
      content: "I agree -- it&#39;s much easier to jump from 0.5% to 1% than it is from 5% to 10%. The typology introduced by Roger Geller makes a useful point: You have a very small proportion of people who will ride their bikes no matter what. Then there is a larger but still small group of people that can be enticed to ride by things like on-street bike lanes and an incomplete network of bike paths. But once you have these two groups riding, something different is required to get a mode share of more than 10%. Thanks for making the point about density and smart growth; can you say more about the Bike Fed&#39;s role there?"
    - author: "Hobbes vs Boyle"
      date: "2014-12-29T21:22:25.146Z"
      content: "Oh, forgot the link to Geller&#39;s typology: <a href=\"https://www.portlandoregon.gov/transportation/44597?a=237507\" rel=\"nofollow\">https://www.portlandoregon.gov/transportation/44597?a=237507</a>"
