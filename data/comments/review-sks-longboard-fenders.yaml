- author: "Helo Driver"
  date: "2011-06-27T03:18:28.722Z"
  content: "Have you had any problems with front fork shimmy?  When I put Longboards on my bike, I could see the front flap oscillating back and forth.  If I pulled my hands off the handlebars, it set up a hell of a shimmy.  I finally took the front fender off..."
- author: "Hobbes vs Boyle"
  date: "2011-06-29T11:55:33.070Z"
  content: "Nope, shimmy hasn&#39;t been a problem for me. But I guess they are always very specific to each bike&#39;s geometry, weight distribution, resonant frequency etc. Did you have them mounted in front or in the back of the crown fork? Sometimes small things like that can make a big difference."
  replies:
    - author: "Hobbes vs Boyle"
      date: "2012-05-21T12:51:51.716Z"
      content: "Replying to myself: On a multi-day tour a couple of weeks ago, I did encounter shimmy problems. I first attributed them to the rear-heavy load, but after the tour the problem persisted. It turned out that one of the Secuclip mounts on the front fender had come just a little bit loose and that seems to have contributed to the problem (I can&#39;t say for sure because the headset was slightly loose, too). So I think it would be good if SKS used less flexible struts on these fenders."
